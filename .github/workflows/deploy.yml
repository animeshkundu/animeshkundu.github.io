name: Build, Test, and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run quality gate
        run: ./scripts/validate.sh

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/

      - name: Verify production artifact
        run: |
          test -f dist/.nojekyll
          test -d dist/_astro
          test -f dist/index.html

      - name: Clean-sync portfolio root
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          WORKTREE="$(mktemp -d)"
          trap 'git worktree remove --force "$WORKTREE"' EXIT
          git worktree add --detach "$WORKTREE" origin/gh-pages

          rsync -a --delete \
            --exclude '/test-*' \
            --exclude '/.git' \
            dist/ "$WORKTREE/"

          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$WORKTREE" add -A

          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "::notice::Production Pages output is already current."
          else
            git -C "$WORKTREE" commit -m "Deploy production build from ${COMMIT_SHA}"
            git -C "$WORKTREE" push origin HEAD:gh-pages
          fi
