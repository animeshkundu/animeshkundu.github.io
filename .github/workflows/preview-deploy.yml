name: Preview Deployment

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run quality gate
        run: ./scripts/validate.sh

  deploy-preview:
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Configure gh-pages push transport
        uses: ./.github/actions/setup-pages-push
        with:
          deploy-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      - name: Resolve preview path
        id: branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          SANITIZED_BRANCH="$(
            printf '%s' "$BRANCH_NAME" |
              sed 's/[^a-zA-Z0-9-]/-/g' |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/-+/-/g; s/^-//; s/-$//' |
              cut -c1-80
          )"
          if [ -z "$SANITIZED_BRANCH" ]; then
            SANITIZED_BRANCH="branch"
          fi
          BRANCH_HASH="$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)"
          DEPLOY_PATH="test-${SANITIZED_BRANCH}-${BRANCH_HASH}"
          {
            echo "branch_name=${BRANCH_NAME}"
            echo "deploy_path=${DEPLOY_PATH}"
            echo "preview_url=https://animesh.kundus.in/${DEPLOY_PATH}/"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build preview
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ steps.branch.outputs.deploy_path }}/

      - name: Verify preview output
        run: |
          npm run check:static
          npm run check:copy

      - name: Test preview base path
        run: npm run test:e2e
        env:
          VITE_BASE_PATH: /${{ steps.branch.outputs.deploy_path }}/

      - name: Clean-sync preview directory
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          DEPLOY_PATH: ${{ steps.branch.outputs.deploy_path }}
        run: |
          set -euo pipefail
          git fetch "$PAGES_PUSH_REMOTE" gh-pages:refs/remotes/origin/gh-pages
          WORKTREE="$(mktemp -d)"
          trap 'git worktree remove --force "$WORKTREE"' EXIT
          git worktree add --detach "$WORKTREE" origin/gh-pages
          PREVIEW_DIR="$WORKTREE/$DEPLOY_PATH"
          mkdir -p "$PREVIEW_DIR"
          rsync -a --delete dist/ "$PREVIEW_DIR/"

          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$WORKTREE" add -A -- "$DEPLOY_PATH"

          if git -C "$WORKTREE" diff --cached --quiet; then
            if [ "$PAGES_PUSH_REMOTE" != "origin" ]; then
              # Content is already on gh-pages, but GitHub only rebuilds Pages
              # on a new push. Push an empty commit over the deploy key so the
              # preview reflects the current gh-pages tree.
              echo "::notice::Preview Pages output unchanged; pushing empty commit to trigger a Pages rebuild."
              git -C "$WORKTREE" commit --allow-empty -m "Rebuild preview for ${BRANCH_NAME}"
              git -C "$WORKTREE" push "$PAGES_PUSH_REMOTE" HEAD:gh-pages
            else
              echo "::notice::Preview Pages output is already current."
            fi
          else
            git -C "$WORKTREE" commit -m "Deploy preview for ${BRANCH_NAME}"
            git -C "$WORKTREE" push "$PAGES_PUSH_REMOTE" HEAD:gh-pages
          fi

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.branch.outputs.preview_url }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          DEPLOY_PATH: ${{ steps.branch.outputs.deploy_path }}
        with:
          script: |
            const marker = '<!-- portfolio-preview -->';
            const body = `${marker}
            ## Preview deployment

            Branch \`${process.env.BRANCH_NAME}\` is available at ${process.env.PREVIEW_URL}.

            Deployment path: \`/${process.env.DEPLOY_PATH}/\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Report preview URL
        run: echo "::notice::Preview deployed to ${{ steps.branch.outputs.preview_url }}"
