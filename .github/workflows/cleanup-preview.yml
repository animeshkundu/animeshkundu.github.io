name: Cleanup Preview Deployment

on: delete

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure gh-pages push transport
        uses: ./.github/actions/setup-pages-push
        with:
          deploy-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      - name: Remove preview deployment
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          SANITIZED_BRANCH="$(
            printf '%s' "$BRANCH_NAME" |
              sed 's/[^a-zA-Z0-9-]/-/g' |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/-+/-/g; s/^-//; s/-$//' |
              cut -c1-80
          )"
          if [ -z "$SANITIZED_BRANCH" ]; then
            SANITIZED_BRANCH="branch"
          fi
          BRANCH_HASH="$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)"
          DEPLOY_PATH="test-${SANITIZED_BRANCH}-${BRANCH_HASH}"
          echo "Cleaning up preview deployment at: ${DEPLOY_PATH}"

          git fetch "$PAGES_PUSH_REMOTE" gh-pages:refs/remotes/origin/gh-pages
          WORKTREE="$(mktemp -d)"
          trap 'git worktree remove --force "$WORKTREE"' EXIT
          git worktree add --detach "$WORKTREE" origin/gh-pages

          if [ ! -d "$WORKTREE/$DEPLOY_PATH" ]; then
            echo "::notice::No preview deployment found at /${DEPLOY_PATH}/"
            exit 0
          fi

          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$WORKTREE" rm -r --quiet -- "$DEPLOY_PATH"
          git -C "$WORKTREE" commit -m "Clean up preview deployment for deleted branch: ${BRANCH_NAME}"
          git -C "$WORKTREE" push "$PAGES_PUSH_REMOTE" HEAD:gh-pages
          echo "::notice::Removed preview deployment at /${DEPLOY_PATH}/"
