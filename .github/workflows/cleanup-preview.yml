name: Cleanup Preview Deployment

on: delete

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Extract branch name and remove preview
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          SANITIZED_BRANCH="$(
            printf '%s' "$BRANCH_NAME" |
              sed 's/[^a-zA-Z0-9-]/-/g' |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/-+/-/g; s/^-//; s/-$//' |
              cut -c1-80
          )"
          if [ -z "$SANITIZED_BRANCH" ]; then
            SANITIZED_BRANCH="branch"
          fi
          BRANCH_HASH="$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)"
          DEPLOY_PATH="test-${SANITIZED_BRANCH}-${BRANCH_HASH}"
          echo "Cleaning up preview deployment at: ${DEPLOY_PATH}"

          if [ -d "${DEPLOY_PATH}" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git rm -r --ignore-unmatch -- "${DEPLOY_PATH}"
            git commit -m "Clean up preview deployment for deleted branch: ${BRANCH_NAME}"
            git push origin gh-pages
            echo "::notice::Removed preview deployment at /${DEPLOY_PATH}/"
          else
            echo "::notice::No preview deployment found at /${DEPLOY_PATH}/"
          fi

      - name: Publish GitHub Pages
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const ensureBranchSource = async () => {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  source: { branch: 'gh-pages', path: '/' },
                });
                core.notice('Enabled GitHub Pages from the gh-pages branch.');
              } catch (error) {
                if (error.status !== 409) {
                  core.warning(
                    `Could not enable GitHub Pages: ${error.status} ${error.message}`,
                  );
                }
              }
            };

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/builds', {
                  owner,
                  repo,
                });
                core.notice('Requested a GitHub Pages build.');
                return;
              } catch (error) {
                if ((error.status === 403 || error.status === 404) && attempt === 1) {
                  await ensureBranchSource();
                }
                if (attempt === 3) {
                  core.warning(
                    `GitHub Pages build was not triggered (${error.status} ` +
                      `${error.message}). The output is already committed to ` +
                      `gh-pages; verify Settings > Pages source is the gh-pages ` +
                      'branch.',
                  );
                  return;
                }
                await sleep(attempt * 3000);
              }
            }
